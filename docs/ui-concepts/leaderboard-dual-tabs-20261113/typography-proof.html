<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>排行榜 · 真实字体样张</title>
<style>
@font-face{font-family:HappyBody;src:url('../../../assets/bundles/home/fonts/zyx_happy_round_body_v1.ttf') format('truetype');font-weight:400;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#eee2c8;color:#684b39;font-family:HappyBody,'PingFang SC',sans-serif}.sheet{max-width:1380px;margin:auto;padding:45px 56px 40px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.intro h1{font-size:25px;font-weight:400;margin:0 0 10px}.intro p{font-size:16px;margin:0;color:#94745b}.status{border:1px solid #c8ad7d;border-radius:22px;padding:10px 16px;font-size:14px}.samples{display:grid;grid-template-columns:1fr 1fr;gap:30px}.panel{border:6px solid #d5a255;border-radius:34px;background:linear-gradient(115deg,#fff9e9,#fff3d7);box-shadow:0 8px 0 #b5906340;padding:24px 28px 28px;position:relative}.plate{width:260px;padding:12px;margin:-8px auto 22px;border:4px solid #e6ae4e;border-radius:24px;background:linear-gradient(#ffdc80,#f4c25c);box-shadow:0 5px 0 #bd98694d;text-align:center}.tabs{display:flex;background:#fff0d2;border:2px solid #dcb47e;border-radius:22px;padding:4px;margin-bottom:14px}.tab{flex:1;display:flex;justify-content:center;align-items:center;padding:10px;border-radius:17px}.tab.active{background:linear-gradient(#ffda73,#ffc344);box-shadow:0 3px 0 #c08c37}.green .tab.active{background:linear-gradient(#d2e79a,#b1d270);box-shadow:0 3px 0 #8eab60}.rule{text-align:center;padding:8px 0 22px}.hero{text-align:center;background:linear-gradient(#ffdf8c,#ffd36a);border:2px solid #eac16c;border-radius:26px;padding:20px 15px 23px;margin-bottom:20px}.green .hero{background:linear-gradient(#edf4d6,#dce9b7);border-color:#bdd291}.bean{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 9px}.name{font-size:23px;margin-bottom:8px;font-weight:400}.metric{font-size:15px;color:#94734c;margin-bottom:2px}.rows{display:grid;gap:10px}.row{display:flex;align-items:center;border-bottom:1px solid #ead7b8;padding:10px 2px 16px;gap:14px}.rank{width:28px;flex:none}.avatar{width:48px;height:48px;object-fit:contain;padding:3px;border:2px solid #b39065;border-radius:14px;background:#ffefc7}.nickname{font-size:21px;flex:1;white-space:nowrap}.value{margin-left:auto}.self{background:#ffe7a9;border:1.5px solid #d7ad63;border-radius:18px;margin-top:22px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between}.green .self{background:#e2edc6;border-color:#a8bd82}.self .label{font-size:17px;margin-bottom:8px}.button{text-align:center;width:78%;margin:24px auto 0;padding:12px;background:#7fc397;border:2px solid #5b9d72;border-radius:21px;box-shadow:0 5px 0 #609773}.note{font-size:13px;margin-top:10px;color:#94745b;text-align:center}.footer{display:flex;gap:40px;margin-top:32px;font-size:15px;color:#806449}.footer p{flex:1;margin:0;line-height:1.8}canvas{vertical-align:middle;max-width:100%;height:auto}.rank canvas{max-width:none}
@media(max-width:800px){.sheet{padding:28px 18px}.samples{grid-template-columns:1fr}.intro{display:block}.status{display:inline-block;margin-top:18px}.footer{display:block}.footer p+p{margin-top:14px}}
</style>
<div class="sheet"><div class="intro"><div><h1>排行榜 · 真实字体样张</h1><p>使用项目中的真实字体与字形图集绘制，文字可以直接用于游戏。</p></div><div class="status">字体预览 · 示例数据</div></div><div class="samples">
<section class="panel"><div class="plate"><canvas data-text="排行榜" data-size="42"></canvas></div><div class="tabs"><div class="tab active"><canvas data-text="积分榜" data-size="30"></canvas></div><div class="tab"><canvas data-text="开心榜" data-size="30"></canvas></div></div><div class="rule"><canvas data-text="按历史最高分排名" data-size="21"></canvas></div><div class="hero"><img class="bean" src="../../../assets/bundles/game/images/formal/bean_hud_mascot_v1.png"><div class="name">恬静的天鹅</div><div class="metric">最高分</div><canvas data-text="3,440" data-size="57"></canvas></div><div class="rows"><div class="row"><span class="rank"><canvas data-text="4" data-size="26"></canvas></span><img class="avatar" src="../../../assets/bundles/game/images/formal/bean_hud_mascot_v1.png"><span class="nickname">美丽的小熊</span><span class="value"><canvas data-text="260" data-size="28"></canvas></span></div><div class="row"><span class="rank"><canvas data-text="5" data-size="26"></canvas></span><img class="avatar" src="../../../assets/bundles/game/images/formal/bean_hud_mascot_v1.png"><span class="nickname">美丽的企鹅</span><span class="value"><canvas data-text="30" data-size="28"></canvas></span></div></div><div class="self"><div><div class="label">我的排名</div><canvas data-text="第 2 名" data-size="31"></canvas></div><div><div class="label">最高分</div><canvas data-text="1,750" data-size="37"></canvas></div></div><div class="button"><canvas data-text="关闭" data-size="30"></canvas></div></section>
<section class="panel green"><div class="plate"><canvas data-text="排行榜" data-size="42"></canvas></div><div class="tabs"><div class="tab"><canvas data-text="积分榜" data-size="30"></canvas></div><div class="tab active"><canvas data-text="开心榜" data-size="30"></canvas></div></div><div class="rule"><canvas data-text="按当前拥有的开心豆排名" data-size="21"></canvas></div><div class="hero"><img class="bean" src="../../../assets/bundles/game/images/formal/bean_hud_mascot_v1.png"><div class="name">快乐的团子</div><div class="metric">当前拥有的开心豆</div><canvas data-text="12,680" data-size="57"></canvas></div><div class="rows"><div class="row"><span class="rank"><canvas data-text="4" data-size="26"></canvas></span><img class="avatar" src="../../../assets/bundles/game/images/formal/bean_hud_mascot_v1.png"><span class="nickname">可爱的企鹅</span><span class="value"><canvas data-text="4,860" data-size="28"></canvas></span></div><div class="row"><span class="rank"><canvas data-text="5" data-size="26"></canvas></span><img class="avatar" src="../../../assets/bundles/game/images/formal/bean_hud_mascot_v1.png"><span class="nickname">就不告诉你</span><span class="value"><canvas data-text="3,280" data-size="28"></canvas></span></div></div><div class="self"><div><div class="label">我的排名</div><canvas data-text="第 5 名" data-size="31"></canvas></div><div><div class="label">当前拥有</div><canvas data-text="3,280" data-size="37"></canvas></div></div><div class="button"><canvas data-text="关闭" data-size="30"></canvas></div></section>
</div><div class="footer"><p>标题与数值：中文与数字均使用 Regular 400，不额外加粗。此页使用真实字体资源验证字形效果，交付策略另行评审。</p><p>昵称：内置圆体中文字体，覆盖常用 GB2312 字符；生僻字和表情交给文本渲染器回退。此页仅验证字体与字级。</p></div></div>
<script>
(async()=>{const base='../../../assets/bundles/home/fonts/zyx_happy_round_display_v1';const source=await(await fetch(base+'.fnt')).text();const chars=new Map();source.split('\n').filter(l=>l.startsWith('char ')).forEach(l=>{const o={};for(const m of l.matchAll(/(\w+)=(-?\d+)/g))o[m[1]]=Number(m[2]);chars.set(o.id,o)});const atlas=new Image();atlas.src=base+'.png';await atlas.decode();await document.fonts.load('23px HappyBody');for(const canvas of document.querySelectorAll('canvas[data-text]')){const text=canvas.dataset.text,size=+canvas.dataset.size,scale=size/96;const glyphs=[...text].map(c=>{const g=chars.get(c.codePointAt(0));if(!g)throw Error('Missing glyph '+c);return g});const width=Math.ceil(glyphs.reduce((n,g)=>n+g.xadvance,0)*scale+6),height=Math.ceil(size*1.25);canvas.width=width*2;canvas.height=height*2;canvas.style.width=width+'px';canvas.style.height=height+'px';const ctx=canvas.getContext('2d');ctx.scale(2,2);let x=3;for(const g of glyphs){ctx.drawImage(atlas,g.x,g.y,g.width,g.height,x+g.xoffset*scale,g.yoffset*scale,g.width*scale,g.height*scale);x+=g.xadvance*scale}ctx.globalCompositeOperation='source-in';ctx.fillStyle='#684b39';ctx.fillRect(0,0,width,height)}window.fontProofReady=true})().catch(e=>{window.fontProofError=e.message;throw e});
</script></html>
